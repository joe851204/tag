<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 不讓搜尋引擎收錄這頁 -->
<meta name="robots" content="noindex, nofollow">
<title>Lost Luggage · 行李失物聯絡</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #1d2433; --muted: #6b7280;
    --accent: #e8590c; --accent-ink: #ffffff; --line: #e5e1d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 40px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); overflow: hidden;
  }
  .head {
    background: var(--ink); color: #fff; padding: 28px 24px 24px;
    position: relative;
  }
  .head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 14px;
    background: radial-gradient(circle at 7px 0, transparent 6px, var(--card) 6.5px) repeat-x;
    background-size: 14px 14px;
  }
  .tag { display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    background: var(--accent); color: var(--accent-ink); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 14px 0 4px; font-size: 26px; line-height: 1.25; }
  .sub { margin: 0; color: #cbd2de; font-size: 15px; line-height: 1.5; }
  .body { padding: 26px 24px 8px; }
  .owner { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  .name { font-size: 22px; font-weight: 700; margin: 0 0 16px; }
  .msg { background: #fff7ed; border-left: 4px solid var(--accent); padding: 12px 14px;
    border-radius: 8px; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
  .msg:empty { display: none; }
  .btns { display: grid; gap: 10px; }
  a.btn, button.btn {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
    border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    text-decoration: none; font-size: 16px; font-family: inherit; cursor: pointer; text-align: left;
  }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn .ic { width: 22px; text-align: center; font-size: 18px; flex: none; }
  .btn .lbl { flex: 1; }
  .btn .val { font-size: 13px; opacity: .75; }
  .foot { padding: 18px 24px 24px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
  .lang { position: absolute; top: 20px; right: 20px; background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <button class="lang" id="langBtn">EN</button>
    <span class="tag" id="t-tag"></span>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
  </header>
  <section class="body">
    <p class="owner" id="t-owner"></p>
    <p class="name" id="name"></p>
    <div class="msg" id="msg"></div>
    <div class="btns" id="btns"></div>
  </section>
  <footer class="foot" id="t-foot"></footer>
</main>

<script>
/* ============================================================
   ✏️  在這裡填你的資料（不需要的欄位留空字串 "" 就會自動隱藏）
   ============================================================ */
const INFO = {
  name:     "Joe.Tsai",              // 顯示的名字
  phone:    "+886 988 947 626",      // 手機，請加國碼 +886，去掉開頭的 0
  email:    "joe871217@gmail.com",
  line:     "",                      // LINE ID，例如 "cheerful123"
  whatsapp: "886988947626",                   // WhatsApp 號碼，只填數字含國碼，例如 "886912345678"
  backupName:  "",                   // 備用聯絡人名字
  backupPhone: "",                   // 備用聯絡人電話
  msgZh: "如果您撿到這件行李，麻煩聯絡我，非常感謝您！",
  msgEn: "If you found this luggage, please contact me. Thank you so much!",
};
/* ============================================================ */

const T = {
  zh: { tag:"Lost & Found", title:"您找到了我的行李", sub:"謝謝您願意幫忙！請用下面任一方式聯絡我。",
        owner:"行李主人", call:"打電話", sms:"傳簡訊", mail:"寄 Email", line:"LINE", wa:"WhatsApp",
        backup:"備用聯絡人", save:"儲存聯絡人", foot:"此頁面僅供行李遺失時聯絡使用。", btn:"EN",
        smsBody:"您好，我撿到您的行李。", mailSubj:"我撿到您的行李" },
  en: { tag:"Lost & Found", title:"You found my luggage", sub:"Thank you for helping! Please reach me any way below.",
        owner:"Owner", call:"Call", sms:"Send SMS", mail:"Send Email", line:"LINE", wa:"WhatsApp",
        backup:"Backup contact", save:"Save contact", foot:"This page is only for returning lost luggage.", btn:"中文",
        smsBody:"Hi, I found your luggage.", mailSubj:"I found your luggage" },
};

const tel = s => s.replace(/[^\d+]/g, "");
let lang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";

function btn(href, ic, lbl, val, primary) {
  const a = document.createElement("a");
  a.className = "btn" + (primary ? " primary" : "");
  a.href = href;
  if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<span class="ic">${ic}</span><span class="lbl">${lbl}</span>` + (val ? `<span class="val">${val}</span>` : "");
  return a;
}

function vcard() {
  const lines = ["BEGIN:VCARD", "VERSION:3.0", `FN:${INFO.name}`, `N:;${INFO.name};;;`];
  if (INFO.phone) lines.push(`TEL;TYPE=CELL:${tel(INFO.phone)}`);
  if (INFO.email) lines.push(`EMAIL:${INFO.email}`);
  lines.push("NOTE:Luggage owner", "END:VCARD");
  const blob = new Blob([lines.join("\r\n")], { type: "text/vcard" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${INFO.name}.vcf`;
  a.click();
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  for (const k of ["tag","title","sub","owner","foot"]) document.getElementById("t-"+k).textContent = t[k];
  document.getElementById("langBtn").textContent = t.btn;
  document.getElementById("name").textContent = INFO.name;
  document.getElementById("msg").textContent = lang === "zh" ? INFO.msgZh : INFO.msgEn;

  const box = document.getElementById("btns");
  box.innerHTML = "";
  if (INFO.phone) {
    box.append(btn(`tel:${tel(INFO.phone)}`, "📞", t.call, INFO.phone, true));
    box.append(btn(`sms:${tel(INFO.phone)}?&body=${encodeURIComponent(t.smsBody)}`, "💬", t.sms));
  }
  if (INFO.email) box.append(btn(`mailto:${INFO.email}?subject=${encodeURIComponent(t.mailSubj)}`, "✉️", t.mail, INFO.email));
  if (INFO.line) box.append(btn(`https://line.me/ti/p/~${encodeURIComponent(INFO.line)}`, "🟢", t.line, INFO.line));
  if (INFO.whatsapp) box.append(btn(`https://wa.me/${INFO.whatsapp}?text=${encodeURIComponent(t.smsBody)}`, "🟩", t.wa));
  if (INFO.backupPhone) box.append(btn(`tel:${tel(INFO.backupPhone)}`, "👤", `${t.backup}${INFO.backupName ? " · " + INFO.backupName : ""}`, INFO.backupPhone));
  if (INFO.phone || INFO.email) {
    const b = document.createElement("button");
    b.className = "btn";
    b.innerHTML = `<span class="ic">📇</span><span class="lbl">${t.save}</span>`;
    b.onclick = vcard;
    box.append(b);
  }
}

document.getElementById("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; render(); };
render();
</script>
</body>
</html>
